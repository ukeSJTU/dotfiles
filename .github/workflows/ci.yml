name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Nix and static checks
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Lix
        uses: samueldr/lix-gha-installer-action@a0fee77b2a98bb7c5c0ed7ae6d6ad4903dbdad0d # v2026-06-15

      - name: Evaluate the flake
        run: nix flake check --all-systems --no-build --show-trace

      - name: Check Nix formatting
        run: nix fmt -- --ci

      - name: Check bootstrap script
        run: |
          nix develop --command bash -n bootstrap.sh
          nix develop --command shellcheck bootstrap.sh
          nix develop --command shfmt -d -i 2 -ci bootstrap.sh

      - name: Check Lua formatting and syntax
        run: |
          nix develop --command stylua \
            --check \
            --config-path .config/nvim/.stylua.toml \
            .config/nvim \
            .config/wezterm \
            .config/yazi/init.lua

      - name: Check workflow definitions
        run: nix develop --command actionlint

      - name: Check trailing whitespace
        run: |
          if git grep -nI -E '[[:blank:]]+$'; then
            echo "::error::Trailing whitespace found"
            exit 1
          fi
